# XiaoZhi music streaming stack.
#
# Bring up with:  docker compose up -d
# Then point the device's websocket URL at:  ws://<host>:8800/
# Control it with:
#   curl -X POST http://<host>:8800/play -d '{"url":"/music/song.mp3","name":"Song"}'
#   curl -X POST http://<host>:8800/stop
#   curl http://<host>:8800/list

services:
  music-service:
    build: .
    image: xiaozhi-music-service
    ports:
      - "8800:8800"
    volumes:
      # Mount your local music library here (read-only).
      - ./music:/music:ro
    restart: unless-stopped

  # Self-hosted XiaoZhi server (LLM / MCP / conversation). This is where the
  # device normally connects. To use music-service you can either:
  #   (a) point the device's websocket URL directly at music-service above, or
  #   (b) integrate music-service behind xiaozhi-server (server-side work).
  # Uncomment and set the correct image/tag for your setup:
  # xiaozhi-server:
  #   image: <your-xiaozhi-server-image>
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./server-data:/data
  #   restart: unless-stopped
